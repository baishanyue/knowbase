# 一键拉起: 应用 + MySQL + Redis + Milvus(etcd/minio)。
#   cp .env.example .env  (修改密码/密钥)  →  docker compose up -d --build
# 仅想本地快速体验(无需向量库和 GPU): 直接 `make demo`,见 README。
# 注: 本文件的服务编排按 Milvus 官方 standalone 模板编写,未在本次构建环境(无 Docker)中实际启动,首次部署请先在测试环境验证。

services:
  app:
    build:
      context: .
      args:
        INSTALL_ML: "1"
    env_file: .env
    environment:
      KNOWBASE_ENV: prod
      KNOWBASE_DATABASE_URL: mysql+pymysql://knowbase:${MYSQL_PASSWORD}@mysql:3306/kb?charset=utf8mb4
      KNOWBASE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KNOWBASE_RETRIEVER_BACKEND: milvus
      KNOWBASE_MILVUS_URI: http://milvus:19530
      KNOWBASE_MODEL_DIR: /models
    ports: ["8080:8080"]
    volumes:
      - ./models:/models:ro          # bge-m3 / bge-reranker-large 放这里
      - uploads:/srv/storage
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: knowbase
      MYSQL_USER: knowbase
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [etcd:/etcd]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    command: minio server /minio_data
    volumes: [minio:/minio_data]
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes: [milvus:/var/lib/milvus]
    depends_on: [etcd, minio]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    restart: unless-stopped

volumes: {uploads: {}, mysql: {}, redis: {}, etcd: {}, minio: {}, milvus: {}}
