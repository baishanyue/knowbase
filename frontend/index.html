<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知底 KnowBase · 企业知识库智能问答平台</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#6b7686; --line:#e3e7ee; --brand:#2f6df6; --brand-soft:#e9f0ff; --warn:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10141a; --card:#181e27; --text:#e6ebf2; --muted:#8c97a8; --line:#283140; --brand:#6a9bff; --brand-soft:#1d2a45; --warn:#f59e0b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:0 16px; height:100dvh; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; } header small { color:var(--muted); }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:6px 12px; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  #login { margin:12vh auto 0; width:min(360px,100%); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  #login h2 { margin:0 0 16px; font-size:18px; } #login input { width:100%; margin-bottom:10px; }
  input, textarea { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 11px; }
  #err { color:#d14343; min-height:20px; font-size:13px; }
  #chat { flex:1; overflow-y:auto; padding:18px 0; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .me { align-self:flex-end; background:var(--brand); color:#fff; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); }
  .route { font-size:12px; color:var(--muted); margin-top:6px; }
  .refused { border-color:var(--warn); }
  .src { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:13px; color:var(--muted); }
  .src div { margin:2px 0; } .src b { color:var(--text); font-weight:600; }
  .fb button { padding:1px 8px; margin-right:4px; font-size:13px; } .fb button.on { background:var(--brand-soft); border-color:var(--brand); }
  form#ask { display:flex; gap:8px; padding:12px 0 18px; } form#ask input { flex:1; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login">
    <h2>登录知底平台</h2>
    <input id="u" placeholder="用户名" autocomplete="username">
    <input id="p" placeholder="密码" type="password" autocomplete="current-password">
    <div id="err"></div>
    <button class="primary" id="loginBtn" style="width:100%">登录</button>
  </div>

  <div id="app" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header><h1>知底 KnowBase · 企业知识库智能问答平台 <small id="who"></small></h1><span><button id="newBtn">新会话</button> <button id="outBtn">退出</button></span></header>
    <div id="chat"></div>
    <form id="ask"><input id="q" placeholder="问问制度、流程、IT/HR 常见问题…" maxlength="1000" autocomplete="off"><button class="primary" id="send">发送</button></form>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const ROUTE = { faq:"来自常见问题库", rag:"基于制度文档生成", chitchat:"", refused:"知识库中未找到可靠依据", error:"服务异常" };
let token = sessionStorage.getItem("knowbase_token"), sessionId = null;

const api = (path, opt = {}) => fetch(path, { ...opt, headers: { "Content-Type":"application/json", ...(token ? {Authorization:"Bearer "+token} : {}), ...opt.headers } });
const esc = t => t.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

async function showApp() {
  const r = await api("/api/v1/auth/me");
  if (!r.ok) { token = null; sessionStorage.removeItem("knowbase_token"); return; }
  const me = await r.json();
  $("#who").textContent = `${me.username} · ${me.department}`;
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
}
$("#loginBtn").onclick = async () => {
  const r = await api("/api/v1/auth/login", { method:"POST", body: JSON.stringify({ username:$("#u").value, password:$("#p").value }) });
  const j = await r.json();
  if (!r.ok) { $("#err").textContent = j.error?.message || "登录失败"; return; }
  token = j.access_token; sessionStorage.setItem("knowbase_token", token); $("#err").textContent = ""; showApp();
};
$("#p").addEventListener("keydown", e => { if (e.key === "Enter") $("#loginBtn").click(); });
$("#outBtn").onclick = async () => { await api("/api/v1/auth/logout", {method:"POST"}); sessionStorage.clear(); location.reload(); };
$("#newBtn").onclick = () => { sessionId = null; $("#chat").innerHTML = ""; };

function bubble(cls, text = "") {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  $("#chat").appendChild(d); $("#chat").scrollTop = 1e9; return d;
}
function renderSources(box, items) {
  const shown = items.filter(s => s.cited).length ? items.filter(s => s.cited) : items;
  const d = document.createElement("div"); d.className = "src";
  d.innerHTML = shown.map(s => s.type === "faq"
    ? `<div>[${s.n}] <b>常见问题</b> · ${esc(s.title)}</div>`
    : `<div>[${s.n}] <b>《${esc(s.title)}》</b>${s.section ? " · " + esc(s.section) : ""}${s.page ? " · 第" + s.page + "页" : ""} <span>v${s.version}</span></div>`).join("");
  box.appendChild(d);
}
function renderFooter(box, end) {
  const f = document.createElement("div"); f.className = "route";
  f.innerHTML = `${ROUTE[end.route] || ""} <span class="fb"> <button data-r="1">👍</button><button data-r="-1">👎</button></span>`;
  f.querySelectorAll("button").forEach(b => b.onclick = async () => {
    await api("/api/v1/feedback", { method:"POST", body: JSON.stringify({ turn_id:end.turn_id, rating:+b.dataset.r }) });
    f.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  });
  box.appendChild(f);
}

$("#ask").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if (!q) return;
  $("#q").value = ""; $("#send").disabled = true; bubble("me", q);
  const box = bubble("bot", "…"); let started = false;
  try {
    const r = await api("/api/v1/chat/stream", { method:"POST", body: JSON.stringify({ question:q, session_id:sessionId }) });
    if (!r.ok) { box.textContent = (await r.json()).error?.message || "请求失败"; return; }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = JSON.parse(raw.split("\n").find(l => l.startsWith("data: ")).slice(6));
        if (ev.type === "meta") sessionId = ev.session_id;
        else if (ev.type === "token") { if (!started) { box.textContent = ""; started = true; } box.textContent += ev.text; }
        else if (ev.type === "sources") renderSources(box, ev.items);
        else if (ev.type === "end") { if (ev.route === "refused") box.classList.add("refused"); renderFooter(box, ev); }
        else if (ev.type === "error") { if (!started) box.textContent = "服务暂时繁忙,请稍后重试。"; }
        $("#chat").scrollTop = 1e9;
      }
    }
  } catch (err) { box.textContent = "网络异常,请重试。"; }
  finally { $("#send").disabled = false; $("#q").focus(); }
};
if (token) showApp();
</script>
</body>
</html>
